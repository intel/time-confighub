name: Trivy Security Scan

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
  # Trigger on push to the main branch
  push:
    branches:
      - main
  
  # Trigger on pull requests to the main branch
  pull_request:
    branches:
      - main

jobs:
  trivy_scan:
    name: Repository Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required if uploading results to the Security tab

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (FS mode)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'          # Scans the current directory (entire repo)
          format: 'table'        # Displays results in the GitHub Actions log
          exit-code: '1'         # Fails the build if vulnerabilities are found
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
